<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Relic Command Centre</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;600;700&family=Orbitron:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000508;
    color: #c8e6f8;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    height: 100vh;
  }
  canvas#scene { display: block; position: fixed; inset: 0; z-index: 0; }

  .scanlines {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(30,220,120,0.005) 2px, rgba(30,220,120,0.005) 4px);
  }
  .vignette {
    position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(0,5,8,0.75) 100%);
  }

  .header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    padding: 16px 28px;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none;
  }
  .header * { pointer-events: auto; }
  .header-left {
    display: flex; align-items: center; gap: 14px;
  }
  .header-left img {
    height: 28px; opacity: 0.9;
  }
  .header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8rem; font-weight: 600;
    letter-spacing: 0.25em; text-transform: uppercase;
    color: rgba(30, 220, 120, 0.7);
    text-shadow: 0 0 10px rgba(28,231,131,0.15);
  }
  .autoplay-btn {
    padding: 6px 14px; border-radius: 2px;
    border: 1px solid rgba(30,220,120,0.25);
    background: rgba(0,20,10,0.6);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem; color: rgba(30,220,120,0.7);
    cursor: pointer; transition: all 0.3s;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .autoplay-btn:hover { border-color: rgba(30,220,120,0.5); }
  .autoplay-btn.active {
    border-color: rgba(28,231,131,0.6);
    color: #1ce783;
    box-shadow: 0 0 12px rgba(28,231,131,0.15);
  }
  .status-pill {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 2px;
    border: 1px solid rgba(30, 220, 120, 0.25);
    background: rgba(0, 20, 10, 0.6);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem; color: rgba(30, 220, 120, 0.8);
  }
  .status-pill .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #1ce783; box-shadow: 0 0 8px #1ce783;
    animation: pulse 2s ease-in-out infinite;
  }
  .status-pill .dot.red { background: #ff3344; box-shadow: 0 0 8px #ff3344; }
  .status-pill .dot.cyan { background: #00e5ff; box-shadow: 0 0 8px #00e5ff; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .revenue-display {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    text-align: center; z-index: 20; pointer-events: none;
  }
  .revenue-display .amount {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.8rem, 3.5vw, 3.2rem); font-weight: 700;
    color: #1ce783;
    text-shadow: 0 0 20px rgba(28,231,131,0.4), 0 0 80px rgba(28,231,131,0.15);
    transition: color 0.8s, text-shadow 0.8s;
    position: relative;
  }
  .revenue-display .amount::after {
    content: '';
    position: absolute; bottom: -4px; left: 20%; right: 20%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #1ce783, transparent);
    opacity: 0.5;
    transition: background 0.8s;
  }
  .revenue-display .amount.red {
    color: #ff3344;
    text-shadow: 0 0 20px rgba(255,51,68,0.4), 0 0 80px rgba(255,51,68,0.15);
  }
  .revenue-display .amount.red::after {
    background: linear-gradient(90deg, transparent, #ff3344, transparent);
  }
  .revenue-display .label {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 0.6rem; text-transform: uppercase;
    letter-spacing: 0.25em; color: rgba(30,220,120,0.4); margin-top: 10px;
  }
  .revenue-display .rate {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem; font-weight: 600; margin-top: 4px;
  }
  .rate.pos { color: rgba(28,231,131,0.9); }
  .rate.neg { color: rgba(255,51,68,0.9); }

  .impact-banner {
    position: fixed; top: 108px; left: 50%; transform: translateX(-50%);
    z-index: 20; padding: 18px 44px; text-align: center; pointer-events: none;
    border: 1px solid; backdrop-filter: blur(8px);
    clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
  }
  .impact-banner.risk { background: rgba(255,20,40,0.08); border-color: rgba(255,51,68,0.6); box-shadow: 0 0 30px rgba(255,51,68,0.1); }
  .impact-banner.saved { background: rgba(0,229,255,0.08); border-color: rgba(0,229,255,0.5); box-shadow: 0 0 30px rgba(0,229,255,0.08); }
  .impact-banner .ib-label { font-family:'Orbitron',sans-serif; font-size:0.8rem; font-weight:500; text-transform:uppercase; letter-spacing:0.15em; }
  .impact-banner.risk .ib-label { color: #ff3344; }
  .impact-banner.saved .ib-label { color: #00e5ff; }
  .impact-banner .ib-value { font-family:'Orbitron',sans-serif; font-size:1.8rem; font-weight:700; margin-top:6px; }
  .impact-banner.risk .ib-value { color: #ff3344; text-shadow: 0 0 12px rgba(255,51,68,0.3); }
  .impact-banner.saved .ib-value { color: #00e5ff; text-shadow: 0 0 12px rgba(0,229,255,0.3); }

  .controls {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 22; display: flex; gap: 20px; align-items: center;
    background: rgba(0,8,12,0.9); backdrop-filter: blur(8px);
    border: 1px solid rgba(30,220,120,0.15);
    padding: 22px 40px;
    clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px), 0 12px);
  }
  .ctrl-btn {
    padding: clamp(14px, 1.8vw, 20px) clamp(28px, 4vw, 48px); border: 1px solid; border-radius: 0;
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(0.7rem, 1vw, 0.9rem); font-weight: 600;
    cursor: pointer; transition: all 0.25s;
    text-transform: uppercase; letter-spacing: 0.12em;
    background: rgba(0,15,25,0.8);
    clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
    position: relative;
    overflow: hidden;
  }
  .ctrl-btn::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 0%, currentColor 50%, transparent 100%);
    opacity: 0;
    transition: opacity 0.3s;
    mix-blend-mode: overlay;
  }
  .ctrl-btn:hover::before { opacity: 0.08; }
  .ctrl-btn:active { transform: scale(0.97); filter: brightness(1.2); }
  .ctrl-btn.danger { border-color: rgba(255,51,68,0.6); color: #ff3344; box-shadow: 0 0 24px rgba(255,51,68,0.15), inset 0 0 12px rgba(255,51,68,0.05); }
  .ctrl-btn.danger:hover { box-shadow: 0 0 40px rgba(255,51,68,0.3), inset 0 0 20px rgba(255,51,68,0.08); }
  .ctrl-btn.success { border-color: rgba(0,229,255,0.6); color: #00e5ff; box-shadow: 0 0 24px rgba(0,229,255,0.15), inset 0 0 12px rgba(0,229,255,0.05); }
  .ctrl-btn.success:hover { box-shadow: 0 0 40px rgba(0,229,255,0.3), inset 0 0 20px rgba(0,229,255,0.08); }
  .ctrl-btn.ghost { border-color: rgba(30,220,120,0.3); color: rgba(30,220,120,0.7); }
  .ctrl-btn.ghost:hover { border-color: rgba(30,220,120,0.6); box-shadow: 0 0 20px rgba(30,220,120,0.1); }
  .ctrl-btn:disabled { opacity: 0.15; pointer-events: none; }

  .ticker-bar {
    position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%);
    z-index: 21; pointer-events: none;
    max-width: 700px; width: 80%;
  }
  .ticker-item {
    padding: 14px 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(0.8rem, 1.1vw, 1rem);
    background: rgba(0,12,8,0.9); border: 1px solid rgba(30,220,120,0.2);
    color: rgba(30,220,120,0.8); backdrop-filter: blur(6px);
    animation: tick-in 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%, 0 8px);
    border-left: 3px solid rgba(30,220,120,0.4);
    text-align: center;
  }
  .ticker-item.error { border-color: rgba(255,51,68,0.4); border-left-color: #ff3344; color: #ff3344; }
  .ticker-item.success { border-color: rgba(0,229,255,0.4); border-left-color: #00e5ff; color: #00e5ff; }
  .ticker-item.warn { border-color: rgba(255,170,0,0.4); border-left-color: #ffaa00; color: #ffaa00; }
  @keyframes tick-in { from{opacity:0;transform:translateY(6px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)} }

  .hidden { display: none !important; }

  .corner-deco { position: fixed; z-index: 6; pointer-events: none; width: 35px; height: 35px; }
  .corner-deco.tl { top:10px;left:10px;border-top:2px solid rgba(28,231,131,0.25);border-left:2px solid rgba(28,231,131,0.25); }
  .corner-deco.tr { top:10px;right:10px;border-top:2px solid rgba(28,231,131,0.25);border-right:2px solid rgba(28,231,131,0.25); }
  .corner-deco.bl { bottom:10px;left:10px;border-bottom:2px solid rgba(28,231,131,0.25);border-left:2px solid rgba(28,231,131,0.25); }
  .corner-deco.br { bottom:10px;right:10px;border-bottom:2px solid rgba(28,231,131,0.25);border-right:2px solid rgba(28,231,131,0.25); }

  @keyframes marching-ants {
    to { stroke-dashoffset: -18; }
  }

  .hud-card {
    position: absolute;
    background: rgba(3,12,8,0.92);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(28,231,131,0.3);
    padding: clamp(14px, 2vw, 22px) clamp(16px, 2.5vw, 28px);
    min-width: clamp(180px, 18vw, 260px);
    min-height: clamp(80px, 8vh, 110px);
    z-index: 15;
    cursor: grab;
    user-select: none;
    transition: border-color 0.5s, box-shadow 0.5s, background 0.5s;
    overflow: visible;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
    box-shadow: 0 0 20px rgba(28,231,131,0.06), inset 0 0 30px rgba(28,231,131,0.02);
    animation: hud-entry 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
  }
  .hud-card::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(28,231,131,0.01) 3px, rgba(28,231,131,0.01) 4px);
    pointer-events: none;
    clip-path: inherit;
  }
  @keyframes hud-entry {
    from { opacity: 0; transform: translateY(8px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .hud-card:active { cursor: grabbing; }
  .hud-card.degraded {
    border-color: rgba(255,51,68,0.6);
    box-shadow: 0 0 30px rgba(255,51,68,0.12), inset 0 0 20px rgba(255,51,68,0.04);
    background: rgba(15,3,5,0.92);
    animation: hud-alarm 1.5s ease-in-out infinite;
  }
  .hud-card.degraded::before {
    background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255,51,68,0.015) 3px, rgba(255,51,68,0.015) 4px);
  }
  @keyframes hud-alarm {
    0%, 100% { box-shadow: 0 0 30px rgba(255,51,68,0.12), inset 0 0 20px rgba(255,51,68,0.04); }
    50% { box-shadow: 0 0 45px rgba(255,51,68,0.2), inset 0 0 30px rgba(255,51,68,0.06); }
  }
  .hud-card.recovered {
    border-color: rgba(0,229,255,0.45);
    box-shadow: 0 0 24px rgba(0,229,255,0.08), inset 0 0 20px rgba(0,229,255,0.02);
    background: rgba(3,8,12,0.92);
  }
  .hud-card .hud-name {
    font-family: 'Chakra Petch', sans-serif;
    font-size: clamp(0.6rem, 0.9vw, 0.8rem); font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.1em; color: rgba(28,231,131,0.75);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 10px;
    transition: color 0.5s;
  }
  .hud-card.degraded .hud-name { color: #ff4455; }
  .hud-card.recovered .hud-name { color: #00e5ff; }
  .hud-card .hud-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #1ce783; box-shadow: 0 0 6px #1ce783, 0 0 12px rgba(28,231,131,0.3);
    transition: background 0.5s, box-shadow 0.5s;
    animation: dot-pulse 2.5s ease-in-out infinite;
  }
  @keyframes dot-pulse {
    0%, 100% { box-shadow: 0 0 6px currentColor, 0 0 12px currentColor; }
    50% { box-shadow: 0 0 3px currentColor, 0 0 6px currentColor; }
  }
  .hud-card.degraded .hud-dot { background: #ff3344; box-shadow: 0 0 6px #ff3344, 0 0 14px rgba(255,51,68,0.4); }
  .hud-card.recovered .hud-dot { background: #00e5ff; box-shadow: 0 0 6px #00e5ff, 0 0 12px rgba(0,229,255,0.3); }
  .hud-card .hud-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(1.1rem, 1.8vw, 1.7rem); font-weight: 700; color: #e8f5e9;
    transition: color 0.5s;
    text-shadow: 0 0 8px rgba(28,231,131,0.2);
  }
  .hud-card.degraded .hud-val { color: #ff6677; text-shadow: 0 0 8px rgba(255,51,68,0.2); }
  .hud-card.recovered .hud-val { color: #e0f7fa; text-shadow: 0 0 8px rgba(0,229,255,0.2); }
  .hud-card .hud-sub {
    font-family: 'Chakra Petch', sans-serif;
    font-size: clamp(0.58rem, 0.85vw, 0.75rem); color: rgba(28,231,131,0.5); margin-top: 6px;
    letter-spacing: 0.03em;
    transition: color 0.5s;
  }
  .hud-card.degraded .hud-sub { color: rgba(255,100,120,0.7); }
  .hud-card.recovered .hud-sub { color: rgba(100,200,255,0.6); }
  .hud-card .hud-log {
    width: 100%;
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 60px;
    overflow: hidden;
  }
  .hud-card .hud-log:empty { margin-top: 0; }
  .hud-log-entry {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(0.55rem, 0.7vw, 0.65rem);
    padding: 4px 8px;
    border-left: 2px solid rgba(28,231,131,0.3);
    background: rgba(28,231,131,0.03);
    color: rgba(28,231,131,0.6);
    text-align: left;
    animation: log-in 0.3s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hud-log-entry.error {
    border-left-color: rgba(255,51,68,0.5);
    background: rgba(255,51,68,0.04);
    color: rgba(255,80,100,0.8);
  }
  .hud-log-entry.success {
    border-left-color: rgba(0,229,255,0.4);
    background: rgba(0,229,255,0.03);
    color: rgba(0,200,230,0.7);
  }
  @keyframes log-in { from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:translateX(0)} }

  .hud-card .resize-handle {
    position: absolute;
    bottom: 4px; right: 4px;
    width: 14px; height: 14px;
    cursor: nwse-resize;
    border-right: 2px solid rgba(28,231,131,0.35);
    border-bottom: 2px solid rgba(28,231,131,0.35);
  }
  .hud-card.degraded .resize-handle { border-color: rgba(255,51,68,0.35); }
  .hud-card.recovered .resize-handle { border-color: rgba(0,229,255,0.35); }
</style>
</head>
<body>

<div class="scanlines"></div>
<div class="vignette"></div>
<div class="corner-deco tl"></div>
<div class="corner-deco tr"></div>
<div class="corner-deco bl"></div>
<div class="corner-deco br"></div>

<div class="header">
  <div class="header-left">
    <img src="https://relibirds.newrelic-es.com/static/media/logo192.png" alt="New Relic">
    <h1>New Relic Command Centre</h1>
  </div>
  <div style="display:flex;align-items:center;gap:14px;">
    <button class="autoplay-btn" id="autoplayBtn">Auto Play</button>
    <div class="status-pill">
      <div class="dot" id="sDot"></div>
      <span id="sText">SYSTEMS NOMINAL</span>
    </div>
  </div>
</div>

<div class="revenue-display">
  <div class="amount" id="revAmt">$2,847,000</div>
  <div class="label">[ Revenue Today ]</div>
  <div class="rate pos" id="revRate">+$12,400/min</div>
</div>

<div class="impact-banner risk hidden" id="riskBanner">
  <div class="ib-label">Revenue at Risk</div>
  <div class="ib-value" id="riskVal">$45,000/min</div>
</div>
<div class="impact-banner saved hidden" id="savedBanner">
  <div class="ib-label">Revenue Protected</div>
  <div class="ib-value" id="savedVal">$0</div>
</div>

<div class="ticker-bar" id="ticker"></div>

<div class="controls">
  <button class="ctrl-btn danger" id="failBtn">Simulate Black Friday Spike</button>
  <button class="ctrl-btn success hidden" id="fixBtn">Deploy Auto-Remediation</button>
  <button class="ctrl-btn ghost hidden" id="resetBtn">Reset</button>
</div>

<canvas id="scene"></canvas>

<div id="alertContainer" style="position:fixed;inset:0;pointer-events:none;z-index:15;"></div>
<svg id="leaderLines" style="position:fixed;inset:0;pointer-events:none;z-index:14;width:100%;height:100%;overflow:visible;"></svg>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const PRIMARY = 0x1ce783;
const PRIMARY_CSS = '#1ce783';
const CYAN = 0x00e5ff;
const RED = 0xff3344;
const AMBER = 0xffaa00;

const state = { phase: 'healthy', revenue: 2_847_000, rate: 12400, riskPerMin: 45000, totalLost: 0 };

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'default' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000508);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(10, 6, 12);
camera.lookAt(0, 3, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.maxPolarAngle = Math.PI / 2.1;
controls.minDistance = 8;
controls.maxDistance = 28;
controls.target.set(0, 3, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;

// No post-processing — render directly for performance
let lastFrameTime = 0;
const FRAME_INTERVAL = 1000 / 30; // Cap at 30fps

scene.add(new THREE.AmbientLight(0x0a1510, 0.3));

// ===== FUNNEL STAGES =====
const stages = [
  { id: 'visitors',   label: 'Website Visitors',   y: 6.0, radius: 4.0, height: 0.8, metric: '142,000/hr', sub: 'sessions active' },
  { id: 'browse',     label: 'Product Browsing',   y: 4.8, radius: 3.4, height: 0.8, metric: '98,400/hr',  sub: 'product page views' },
  { id: 'cart',       label: 'Add to Cart',        y: 3.6, radius: 2.8, height: 0.8, metric: '34,200/hr',  sub: 'items carted' },
  { id: 'checkout',   label: 'Checkout',           y: 2.4, radius: 2.2, height: 0.8, metric: '18,600/hr',  sub: 'checkout initiated' },
  { id: 'payment',    label: 'Payment Processing', y: 1.2, radius: 1.7, height: 0.8, metric: '99.7%',      sub: 'transaction success' },
  { id: 'delivery',   label: 'Order & Delivery',   y: 0.0, radius: 1.2, height: 0.8, metric: '1,240/hr',   sub: 'orders dispatched' },
];

const degradedMetrics = {
  visitors: { metric: '142,000/hr', sub: 'page load 12s+ — bouncing' },
  browse:   { metric: '31,200/hr',  sub: '↓ 68% — timeout errors' },
  cart:     { metric: '8,100/hr',   sub: '↓ 76% — cart failures' },
  checkout: { metric: '2,400/hr',   sub: '↓ 87% — checkout errors' },
  payment:  { metric: '34.2%',      sub: 'FAILURE rate' },

// ===== BUILD FUNNEL =====
const sectionMaterials = {};

stages.forEach(sec => {
  const group = new THREE.Group();
  const geo = new THREE.CylinderGeometry(sec.radius, sec.radius, sec.height, 6, 1, false);
  const edges = new THREE.EdgesGeometry(geo);
  const wireMat = new THREE.LineBasicMaterial({ color: PRIMARY, transparent: true, opacity: 0.6 });
  const wireframe = new THREE.LineSegments(edges, wireMat);
  wireframe.position.y = sec.y + sec.height / 2;
  group.add(wireframe);

  const fillMat = new THREE.MeshBasicMaterial({ color: PRIMARY, transparent: true, opacity: 0.02, side: THREE.DoubleSide, depthWrite: false });
  const fill = new THREE.Mesh(geo, fillMat);
  fill.position.y = sec.y + sec.height / 2;
  group.add(fill);

  const topGeo = new THREE.CircleGeometry(sec.radius, 6);
  const topMat = new THREE.MeshBasicMaterial({ color: PRIMARY, transparent: true, opacity: 0.035, side: THREE.DoubleSide, depthWrite: false });
  const top = new THREE.Mesh(topGeo, topMat);
  top.rotation.x = -Math.PI / 2;
  top.position.y = sec.y + sec.height;
  group.add(top);

  const ringGeo = new THREE.RingGeometry(sec.radius - 0.05, sec.radius + 0.05, 6);
  const ringMat = new THREE.MeshBasicMaterial({ color: PRIMARY, transparent: true, opacity: 0.1, side: THREE.DoubleSide, depthWrite: false });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = sec.y + sec.height;
  group.add(ring);

  for (let i = 0; i < 6; i++) {
    const angle = (i / 6) * Math.PI * 2;
    const points = [
      new THREE.Vector3(0, sec.y + 0.01, 0),
      new THREE.Vector3(Math.cos(angle) * sec.radius, sec.y + 0.01, Math.sin(angle) * sec.radius),
    ];
    group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), new THREE.LineBasicMaterial({ color: PRIMARY, transparent: true, opacity: 0.1 })));
  }

  scene.add(group);
  sectionMaterials[sec.id] = { wireMat, fillMat, topMat, ringMat };
});

// Vertical connectors
stages.forEach((sec, i) => {
  if (i === stages.length - 1) return;
  const next = stages[i + 1];
  for (let j = 0; j < 6; j++) {
    const angle = (j / 6) * Math.PI * 2;
    const r = next.radius * 0.5;
    const pts = [
      new THREE.Vector3(Math.cos(angle) * r, next.y + next.height, Math.sin(angle) * r),
      new THREE.Vector3(Math.cos(angle) * r * 1.2, sec.y, Math.sin(angle) * r * 1.2),
    ];
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: PRIMARY, transparent: true, opacity: 0.12 })));
  }
});

// Spine
const spineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -0.5, 0), new THREE.Vector3(0, 7.5, 0)]);
const spineMat = new THREE.LineBasicMaterial({ color: PRIMARY, transparent: true, opacity: 0.35 });
scene.add(new THREE.Line(spineGeo, spineMat));

// Core

core.position.y = 3.5;

const alertContainer = document.getElementById('alertContainer');
const leaderSVG = document.getElementById('leaderLines');

  cart:     { side: 'left', row: 1 },

// Create HUD card elements

// Reposition cards based on current viewport + camera — called on resize/zoom
function repositionCards() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const cx = w / 2;
  const offsetX = Math.min(440, w * 0.38);

  stages.forEach(sec => {
    const pos = alertPositions[sec.id];
    if (pos.manuallyMoved) return;

    const layout = alertLayout[sec.id];
    const worldPos = new THREE.Vector3(0, sec.y + sec.height / 2, 0);
    const screenPos = worldPos.clone().project(camera);
    const sy = (-screenPos.y * 0.5 + 0.5) * h;

    let x;
    if (layout.side === 'right') {
      x = cx + offsetX - 120;
    } else {
      x = cx - offsetX - 120;
    }

    x = Math.max(10, Math.min(x, w - 250));
    const y = Math.max(60, Math.min(sy - 50, h - 160));

    pos.x = x;
    pos.y = y;
    alerts[sec.id].style.left = x + 'px';
    alerts[sec.id].style.top = y + 'px';
  });
}

repositionCards();

// Drag logic
let activeDrag = null;
let dragOffset = { x: 0, y: 0 };
alertContainer.style.pointerEvents = 'none';

document.addEventListener('mousedown', (e) => {
  if (e.target.closest('.resize-handle')) return;
  const card = e.target.closest('.hud-card');
  if (!card) return;
  activeDrag = card.id.replace('hud-', '');
  const rect = card.getBoundingClientRect();
  dragOffset.x = e.clientX - rect.left;
  dragOffset.y = e.clientY - rect.top;
  card.style.cursor = 'grabbing';
  card.style.zIndex = '16';
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (!activeDrag) return;
  const pos = alertPositions[activeDrag];
  pos.x = e.clientX - dragOffset.x;
  pos.y = e.clientY - dragOffset.y;
  pos.manuallyMoved = true;
  alerts[activeDrag].style.left = pos.x + 'px';
  alerts[activeDrag].style.top = pos.y + 'px';
});

// Resize logic
let activeResize = null;
let resizeStart = { x: 0, y: 0, w: 0, h: 0 };

document.addEventListener('mousedown', (e) => {
  const handle = e.target.closest('.resize-handle');
  if (handle) {
    activeResize = handle.dataset.resize;
    const card = alerts[activeResize];
    const rect = card.getBoundingClientRect();
    resizeStart = { x: e.clientX, y: e.clientY, w: rect.width, h: rect.height };
    e.preventDefault();
    e.stopPropagation();
  }
});

document.addEventListener('mousemove', (e) => {
  if (activeResize) {
    const dx = e.clientX - resizeStart.x;
    const dy = e.clientY - resizeStart.y;
    const card = alerts[activeResize];
    card.style.width = Math.max(150, resizeStart.w + dx) + 'px';
    card.style.height = Math.max(60, resizeStart.h + dy) + 'px';
  }
});

document.addEventListener('mouseup', () => {
  if (activeDrag) {
    alerts[activeDrag].style.cursor = 'grab';
    alerts[activeDrag].style.zIndex = '15';
    activeDrag = null;
  }
  activeResize = null;
});

// Leader lines
function updateLeaderLines() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  stages.forEach(sec => {
    const el = alerts[sec.id];
    const rect = el.getBoundingClientRect();
    const worldPos = new THREE.Vector3(0, sec.y + sec.height / 2, 0);
    const screenPos = worldPos.clone().project(camera);
    const sx = (screenPos.x * 0.5 + 0.5) * w;
    const sy = (-screenPos.y * 0.5 + 0.5) * h;

    let line = document.getElementById('line-' + sec.id);
    let dot = document.getElementById('ldot-' + sec.id);
    if (!line) {
      line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      line.id = 'line-' + sec.id;
      line.setAttribute('fill', 'none');
      line.setAttribute('stroke-width', '1.5');
      line.setAttribute('stroke-dasharray', '6 4 2 4');
      line.style.animation = 'marching-ants 1.5s linear infinite';
      leaderSVG.appendChild(line);
      dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.id = 'ldot-' + sec.id;
      dot.setAttribute('r', '4');
      leaderSVG.appendChild(dot);
    }

    const isLeft = (rect.left + rect.width / 2) < w / 2;
    const edgeX = isLeft ? rect.right : rect.left;
    const edgeY = rect.top + rect.height / 2;
    const isDegraded = el.classList.contains('degraded');
    const isRecovered = el.classList.contains('recovered');
    const stroke = isDegraded ? 'rgba(255,51,68,0.35)' : isRecovered ? 'rgba(0,229,255,0.25)' : 'rgba(28,231,131,0.2)';
    const dotFill = isDegraded ? '#ff3344' : isRecovered ? '#00e5ff' : PRIMARY_CSS;

    line.setAttribute('stroke', stroke);
    line.setAttribute('points', `${sx},${sy} ${edgeX},${edgeY}`);
    dot.setAttribute('fill', dotFill);
    dot.setAttribute('cx', sx);
    dot.setAttribute('cy', sy);
  });
}

// Alert state
function setAlertState(id, mode) {
  const el = alerts[id];
  const val = document.getElementById('hv-' + id);
  const sub = document.getElementById('hs-' + id);
  if (mode === 'degraded') {
    el.className = 'hud-card degraded';
    val.textContent = degradedMetrics[id].metric;
    sub.textContent = degradedMetrics[id].sub;
  } else if (mode === 'recovered') {
    el.className = 'hud-card recovered';
    val.textContent = recoveredMetrics[id].metric;
    sub.textContent = recoveredMetrics[id].sub;
  } else {
    el.className = 'hud-card';
    const s = stages.find(s => s.id === id);
    val.textContent = s.metric;
    sub.textContent = s.sub;
  }
}

// Section colour
function setSectionColor(id, color, intensity) {
  const m = sectionMaterials[id];
  m.wireMat.color.setHex(color);
  m.wireMat.opacity = intensity;
  m.fillMat.color.setHex(color);
  m.fillMat.opacity = color === RED ? 0.05 : 0.02;
  m.topMat.color.setHex(color);
  m.topMat.opacity = color === RED ? 0.07 : 0.035;
  m.ringMat.color.setHex(color);
  m.ringMat.opacity = color === RED ? 0.22 : 0.1;
  sectionLights[id].color.setHex(color);
  sectionLights[id].intensity = color === RED ? 2.5 : 0.3;
}

// ===== ANIMATION =====
let time = 0;
let particleSpeed = 1.0;
let frameCount = 0;

function animate(now) {
  requestAnimationFrame(animate);
  if (now - lastFrameTime < FRAME_INTERVAL) return;
  lastFrameTime = now;
  time += 0.033;
  frameCount++;
  controls.update();

  core.rotation.x = time * 0.4;
  core.rotation.y = time * 0.6;
  containRing.rotation.z = time * 0.08;
  dustMesh.rotation.y = time * 0.02;

  const w = window.innerWidth;
  const h = window.innerHeight;

  dataParticles.forEach(p => {
    const d = p.mesh.userData;
    d.offset += 0.002 * d.speed * particleSpeed;
    if (d.offset > 1) {
      d.offset = 0;
      d.userId = Math.floor(100000 + Math.random() * 900000);
      p.label.textContent = `userId: ${d.userId}`;
    }
    const t = d.offset;
    const r = 4.0 - 2.8 * t;
    const y = 7.0 - t * 7.5;
    const angle = t * Math.PI * 4 + d.speed * 20;
    p.mesh.position.set(Math.cos(angle) * r * 0.6, y, Math.sin(angle) * r * 0.6);

    const screenPos = p.mesh.position.clone().project(camera);
    const sx = (screenPos.x * 0.5 + 0.5) * w;
    const sy = (-screenPos.y * 0.5 + 0.5) * h;
    p.label.style.transform = `translate(8px, -50%) translate3d(0,0,0)`;
    p.label.style.left = sx + 'px';
    p.label.style.top = sy + 'px';
    p.label.style.opacity = screenPos.z > 1 ? '0' : '1';
  });

  if (state.phase === 'degraded') {
    const pulse = Math.sin(time * 4) * 0.3 + 0.7;
    coreGlow.intensity = pulse * 3;
    coreGlow.color.setHex(RED);
    coreMat.color.setHex(RED);
    spineMat.color.setHex(RED);
    spineMat.opacity = pulse * 0.5;
    containMat.color.setHex(RED);
    containMat.opacity = pulse * 0.12;
    stages.forEach(sec => {
      const m = sectionMaterials[sec.id];
      if (m.wireMat.color.getHex() === RED) {
        m.wireMat.opacity = 0.5 + pulse * 0.5;
        m.fillMat.opacity = 0.03 + pulse * 0.04;
        m.ringMat.opacity = 0.12 + pulse * 0.15;
        sectionLights[sec.id].intensity = pulse * 3;
      }
    });
  } else if (state.phase === 'recovering') {
    coreGlow.color.setHex(CYAN); coreGlow.intensity = 2;
    coreMat.color.setHex(CYAN); spineMat.color.setHex(CYAN); spineMat.opacity = 0.4;
    containMat.color.setHex(CYAN); containMat.opacity = 0.1;
  } else {
    coreGlow.color.setHex(PRIMARY); coreGlow.intensity = 1.5;
    coreMat.color.setHex(PRIMARY); spineMat.color.setHex(PRIMARY); spineMat.opacity = 0.35;
    containMat.color.setHex(PRIMARY); containMat.opacity = 0.08;
  }

  if (frameCount % 4 === 0) updateLeaderLines();
  renderer.render(scene, camera);
}

animate();

// ===== REVENUE =====
function fmt(n) {
  if (n >= 1_000_000) return '$' + (n/1_000_000).toFixed(2) + 'M';
  if (n >= 1_000) return '$' + Math.round(n/1_000).toLocaleString() + 'K';
  return '$' + Math.round(n).toLocaleString();
}

setInterval(() => {
  if (state.phase === 'healthy' || state.phase === 'recovered') state.revenue += state.rate / 60;
  else if (state.phase === 'degraded') {
    state.revenue -= state.riskPerMin / 60 * (0.8 + Math.random() * 0.4);
    state.totalLost += state.riskPerMin / 60;
    if (state.revenue < 500_000) state.revenue = 500_000;
  } else if (state.phase === 'recovering') state.revenue += 6000 / 60;

  document.getElementById('revAmt').textContent = fmt(state.revenue);
  if (state.phase === 'degraded') {
    document.getElementById('revAmt').className = 'amount red';
    document.getElementById('revRate').className = 'rate neg';
    document.getElementById('revRate').textContent = '-$' + Math.round(state.riskPerMin).toLocaleString() + '/min';
  } else {
    document.getElementById('revAmt').className = 'amount';
    document.getElementById('revRate').className = 'rate pos';
    document.getElementById('revRate').textContent = '+$' + Math.round(state.rate).toLocaleString() + '/min';
  }
}, 1000);

// ===== HUD LOG (messages appear inside relevant HUD cards) =====
function addHudLog(stageId, msg, type = '') {
  const log = document.getElementById('hlog-' + stageId);
  if (!log) return;
  const el = document.createElement('div');
  el.className = 'hud-log-entry ' + type;
  el.textContent = msg;
  log.prepend(el);
  if (log.children.length > 3) log.removeChild(log.lastChild);
}

function clearHudLogs() {
  stages.forEach(sec => {
    const log = document.getElementById('hlog-' + sec.id);
    if (log) log.innerHTML = '';
  });
}

// Global status line for system-wide messages
function setStatusMsg(msg, type = '') {
  const bar = document.getElementById('ticker');
  bar.innerHTML = '';
  if (!msg) return;
  const el = document.createElement('div');
  el.className = 'ticker-item ' + type;
  const t = new Date();
  const ts = t.toLocaleTimeString('en-AU', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  el.innerHTML = `<span style="opacity:0.5;margin-right:6px">${ts}</span><span style="opacity:0.6;margin-right:4px">›</span>${msg}`;
  bar.appendChild(el);
}

  clearHudLogs();
  setStatusMsg('System reset — nominal');
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  repositionCards();
});

setStatusMsg('Command Centre online — monitoring conversion funnel');

// ===== AUTOPLAY =====
let autoplayActive = false;
let autoplayTimer = null;

function autoplayLoop() {
  if (!autoplayActive) return;

  if (state.phase === 'healthy') {
    document.getElementById('failBtn').click();
    autoplayTimer = setTimeout(autoplayLoop, 10000);
  } else if (state.phase === 'degraded') {
    document.getElementById('fixBtn').click();
    autoplayTimer = setTimeout(autoplayLoop, 10000);
  } else if (state.phase === 'recovered') {
    document.getElementById('resetBtn').click();
    autoplayTimer = setTimeout(autoplayLoop, 5000);
  } else {
    autoplayTimer = setTimeout(autoplayLoop, 2000);
  }
}

document.getElementById('autoplayBtn').addEventListener('click', () => {
  autoplayActive = !autoplayActive;
  const btn = document.getElementById('autoplayBtn');
  btn.classList.toggle('active', autoplayActive);
  btn.textContent = autoplayActive ? 'Auto Play ●' : 'Auto Play';

  if (autoplayActive) {
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;
    autoplayLoop();
  } else {
    if (autoplayTimer) clearTimeout(autoplayTimer);
    autoplayTimer = null;
  }
});
</script>

</body>
