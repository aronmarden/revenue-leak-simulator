<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revenue Command Centre</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;600;700&family=Orbitron:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000508;
    color: #c8e6f8;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    height: 100vh;
  }
  canvas#scene { display: block; position: fixed; inset: 0; z-index: 0; }

  .scanlines {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(30,220,120,0.005) 2px, rgba(30,220,120,0.005) 4px);
  }
  .vignette {
    position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(0,5,8,0.75) 100%);
  }

  .header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    padding: 16px 28px;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none;
  }
  .header * { pointer-events: auto; }
  .header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem; font-weight: 500;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(30, 220, 120, 0.6);
  }
  .status-pill {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 2px;
    border: 1px solid rgba(30, 220, 120, 0.25);
    background: rgba(0, 20, 10, 0.6);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem; color: rgba(30, 220, 120, 0.8);
  }
  .status-pill .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #1ce783; box-shadow: 0 0 8px #1ce783;
    animation: pulse 2s ease-in-out infinite;
  }
  .status-pill .dot.red { background: #ff3344; box-shadow: 0 0 8px #ff3344; }
  .status-pill .dot.cyan { background: #00e5ff; box-shadow: 0 0 8px #00e5ff; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .revenue-display {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    text-align: center; z-index: 20; pointer-events: none;
  }
  .revenue-display .amount {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.2rem; font-weight: 600;
    color: #1ce783;
    text-shadow: 0 0 20px rgba(28,231,131,0.3), 0 0 60px rgba(28,231,131,0.1);
    transition: color 0.8s, text-shadow 0.8s;
  }
  .revenue-display .amount.red {
    color: #ff3344;
    text-shadow: 0 0 20px rgba(255,51,68,0.3), 0 0 60px rgba(255,51,68,0.1);
  }
  .revenue-display .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.55rem; text-transform: uppercase;
    letter-spacing: 0.15em; color: rgba(30,220,120,0.4); margin-top: 2px;
  }
  .revenue-display .rate {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem; margin-top: 2px;
  }
  .rate.pos { color: rgba(28,231,131,0.9); }
  .rate.neg { color: rgba(255,51,68,0.9); }

  .impact-banner {
    position: fixed; top: 100px; left: 50%; transform: translateX(-50%);
    z-index: 20; padding: 12px 28px; text-align: center; pointer-events: none;
    border: 1px solid; backdrop-filter: blur(4px);
  }
  .impact-banner.risk { background: rgba(255,30,50,0.06); border-color: rgba(255,51,68,0.5); }
  .impact-banner.saved { background: rgba(0,229,255,0.06); border-color: rgba(0,229,255,0.5); }
  .impact-banner .ib-label { font-family:'Orbitron',sans-serif; font-size:0.6rem; font-weight:500; text-transform:uppercase; letter-spacing:0.12em; }
  .impact-banner.risk .ib-label { color: #ff3344; }
  .impact-banner.saved .ib-label { color: #00e5ff; }
  .impact-banner .ib-value { font-family:'Orbitron',sans-serif; font-size:1.3rem; font-weight:600; margin-top:3px; }
  .impact-banner.risk .ib-value { color: #ff3344; }
  .impact-banner.saved .ib-value { color: #00e5ff; }

  .controls {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 20; display: flex; gap: 20px; align-items: center;
    background: rgba(0,10,20,0.75); backdrop-filter: blur(6px);
    border: 1px solid rgba(30,220,120,0.2);
    padding: 20px 36px; border-radius: 4px;
  }
  .ctrl-btn {
    padding: 18px 44px; border: 1px solid; border-radius: 3px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.82rem; font-weight: 500;
    cursor: pointer; transition: all 0.3s;
    text-transform: uppercase; letter-spacing: 0.08em;
    background: rgba(0,20,40,0.6);
  }
  .ctrl-btn.danger { border-color: rgba(255,51,68,0.5); color: #ff3344; box-shadow: 0 0 20px rgba(255,51,68,0.12); }
  .ctrl-btn.danger:hover { background: rgba(255,51,68,0.1); box-shadow: 0 0 30px rgba(255,51,68,0.25); }
  .ctrl-btn.success { border-color: rgba(0,229,255,0.5); color: #00e5ff; box-shadow: 0 0 20px rgba(0,229,255,0.12); }
  .ctrl-btn.success:hover { background: rgba(0,229,255,0.1); box-shadow: 0 0 30px rgba(0,229,255,0.25); }
  .ctrl-btn.ghost { border-color: rgba(30,220,120,0.25); color: rgba(30,220,120,0.6); }
  .ctrl-btn.ghost:hover { border-color: rgba(30,220,120,0.5); }
  .ctrl-btn:disabled { opacity: 0.2; pointer-events: none; }

  .ticker-bar {
    position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%);
    z-index: 20; display: flex; gap: 10px; max-width: 900px; pointer-events: none;
    flex-wrap: wrap; justify-content: center;
  }
  .ticker-item {
    flex-shrink: 0; padding: 7px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    background: rgba(0,20,10,0.7); border: 1px solid rgba(30,220,120,0.15);
    color: rgba(30,220,120,0.7); backdrop-filter: blur(4px);
    animation: tick-in 0.3s ease; white-space: nowrap;
  }
  .ticker-item.error { border-color: rgba(255,51,68,0.4); color: #ff3344; }
  .ticker-item.success { border-color: rgba(0,229,255,0.4); color: #00e5ff; }
  .ticker-item.warn { border-color: rgba(255,170,0,0.4); color: #ffaa00; }
  @keyframes tick-in { from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)} }

  .hidden { display: none !important; }

  .corner-deco { position: fixed; z-index: 6; pointer-events: none; }
  .corner-deco.tl { top:8px;left:8px;border-top:1px solid rgba(28,231,131,0.2);border-left:1px solid rgba(28,231,131,0.2);width:25px;height:25px; }
  .corner-deco.tr { top:8px;right:8px;border-top:1px solid rgba(28,231,131,0.2);border-right:1px solid rgba(28,231,131,0.2);width:25px;height:25px; }
  .corner-deco.bl { bottom:8px;left:8px;border-bottom:1px solid rgba(28,231,131,0.2);border-left:1px solid rgba(28,231,131,0.2);width:25px;height:25px; }
  .corner-deco.br { bottom:8px;right:8px;border-bottom:1px solid rgba(28,231,131,0.2);border-right:1px solid rgba(28,231,131,0.2);width:25px;height:25px; }

  .hud-card {
    position: absolute;
    background: rgba(5,15,10,0.88);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(28,231,131,0.35);
    border-radius: 4px;
    padding: 14px 18px;
    min-width: 180px;
    min-height: 70px;
    z-index: 15;
    cursor: grab;
    user-select: none;
    transition: border-color 0.5s, box-shadow 0.5s, background 0.5s;
    overflow: visible;
  }
  .hud-card:active { cursor: grabbing; }
  .hud-card.degraded {
    border-color: rgba(255,51,68,0.6);
    box-shadow: 0 0 20px rgba(255,51,68,0.12), inset 0 0 12px rgba(255,51,68,0.04);
    background: rgba(20,5,5,0.88);
  }
  .hud-card.recovered {
    border-color: rgba(0,229,255,0.5);
    box-shadow: 0 0 16px rgba(0,229,255,0.1);
    background: rgba(5,10,15,0.88);
  }
  .hud-card .hud-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.6rem; font-weight: 500; text-transform: uppercase;
    letter-spacing: 0.08em; color: rgba(28,231,131,0.7);
    display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
    transition: color 0.5s;
  }
  .hud-card.degraded .hud-name { color: #ff3344; }
  .hud-card.recovered .hud-name { color: #00e5ff; }
  .hud-card .hud-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #1ce783; box-shadow: 0 0 5px #1ce783;
    transition: background 0.5s, box-shadow 0.5s;
  }
  .hud-card.degraded .hud-dot { background: #ff3344; box-shadow: 0 0 5px #ff3344; }
  .hud-card.recovered .hud-dot { background: #00e5ff; box-shadow: 0 0 5px #00e5ff; }
  .hud-card .hud-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem; font-weight: 700; color: #e8f5e9;
    transition: color 0.5s;
  }
  .hud-card.degraded .hud-val { color: #ff6677; }
  .hud-card.recovered .hud-val { color: #e0f7fa; }
  .hud-card .hud-sub {
    font-size: 0.6rem; color: rgba(28,231,131,0.5); margin-top: 3px;
    transition: color 0.5s;
  }
  .hud-card.degraded .hud-sub { color: rgba(255,100,120,0.7); }
  .hud-card.recovered .hud-sub { color: rgba(100,200,255,0.6); }
  .hud-card .resize-handle {
    position: absolute;
    bottom: 2px; right: 2px;
    width: 14px; height: 14px;
    cursor: nwse-resize;
    border-right: 2px solid rgba(28,231,131,0.4);
    border-bottom: 2px solid rgba(28,231,131,0.4);
  }
  .hud-card.degraded .resize-handle { border-color: rgba(255,51,68,0.4); }
  .hud-card.recovered .resize-handle { border-color: rgba(0,229,255,0.4); }
</style>
</head>
<body>

<div class="scanlines"></div>
<div class="vignette"></div>
<div class="corner-deco tl"></div>
<div class="corner-deco tr"></div>
<div class="corner-deco bl"></div>
<div class="corner-deco br"></div>

<div class="header">
  <h1>Revenue Command Centre</h1>
  <div class="status-pill">
    <div class="dot" id="sDot"></div>
    <span id="sText">SYSTEMS NOMINAL</span>
  </div>
</div>

<div class="revenue-display">
  <div class="amount" id="revAmt">$2,847,000</div>
  <div class="label">Revenue Today</div>
  <div class="rate pos" id="revRate">+$12,400/min</div>
</div>

<div class="impact-banner risk hidden" id="riskBanner">
  <div class="ib-label">Revenue at Risk</div>
  <div class="ib-value" id="riskVal">$45,000/min</div>
</div>
<div class="impact-banner saved hidden" id="savedBanner">
  <div class="ib-label">Revenue Protected</div>
  <div class="ib-value" id="savedVal">$0</div>
</div>

<div class="ticker-bar" id="ticker"></div>

<div class="controls">
  <button class="ctrl-btn danger" id="failBtn">Simulate Black Friday Spike</button>
  <button class="ctrl-btn success hidden" id="fixBtn">Deploy Auto-Remediation</button>
  <button class="ctrl-btn ghost hidden" id="resetBtn">Reset</button>
</div>

<canvas id="scene"></canvas>

<div id="alertContainer" style="position:fixed;inset:0;pointer-events:none;z-index:15;"></div>
<svg id="leaderLines" style="position:fixed;inset:0;pointer-events:none;z-index:14;width:100%;height:100%;overflow:visible;"></svg>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const PRIMARY = 0x1ce783;
const PRIMARY_CSS = '#1ce783';
const CYAN = 0x00e5ff;
const RED = 0xff3344;
const AMBER = 0xffaa00;

const state = { phase: 'healthy', revenue: 2_847_000, rate: 12400, riskPerMin: 45000, totalLost: 0 };

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'default' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000508);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(10, 6, 12);
camera.lookAt(0, 3, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.maxPolarAngle = Math.PI / 2.1;
controls.minDistance = 8;
controls.maxDistance = 28;
controls.target.set(0, 3, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;

// No post-processing — render directly for performance
let lastFrameTime = 0;
const FRAME_INTERVAL = 1000 / 30; // Cap at 30fps

scene.add(new THREE.AmbientLight(0x0a1510, 0.3));

// ===== FUNNEL STAGES =====
const stages = [
  { id: 'visitors',   label: 'Website Visitors',   y: 6.0, radius: 4.0, height: 0.8, metric: '142,000/hr', sub: 'sessions active' },
  { id: 'browse',     label: 'Product Browsing',   y: 4.8, radius: 3.4, height: 0.8, metric: '98,400/hr',  sub: 'product page views' },
  { id: 'cart',       label: 'Add to Cart',        y: 3.6, radius: 2.8, height: 0.8, metric: '34,200/hr',  sub: 'items carted' },
  { id: 'checkout',   label: 'Checkout',           y: 2.4, radius: 2.2, height: 0.8, metric: '18,600/hr',  sub: 'checkout initiated' },
  { id: 'payment',    label: 'Payment Processing', y: 1.2, radius: 1.7, height: 0.8, metric: '99.7%',      sub: 'transaction success' },
  { id: 'delivery',   label: 'Order & Delivery',   y: 0.0, radius: 1.2, height: 0.8, metric: '1,240/hr',   sub: 'orders dispatched' },
];

const degradedMetrics = {
  visitors: { metric: '142,000/hr', sub: 'page load 12s+ — bouncing' },
  browse:   { metric: '31,200/hr',  sub: '↓ 68% — timeout errors' },
  cart:     { metric: '8,100/hr',   sub: '↓ 76% — cart failures' },
  checkout: { metric: '2,400/hr',   sub: '↓ 87% — checkout errors' },
  payment:  { metric: '34.2%',      sub: 'FAILURE rate' },
  delivery: { metric: '180/hr',     sub: 'backlog: 4,200 pending' },
};

const recoveredMetrics = {
  visitors: { metric: '156,000/hr', sub: 'sessions active' },
  browse:   { metric: '112,000/hr', sub: 'product page views' },
  cart:     { metric: '41,800/hr',  sub: 'items carted' },
  checkout: { metric: '22,400/hr',  sub: 'checkout initiated' },
  payment:  { metric: '99.9%',      sub: 'transaction success' },
  delivery: { metric: '1,680/hr',   sub: 'orders dispatched' },
};

// ===== BUILD FUNNEL =====
const sectionMaterials = {};

stages.forEach(sec => {
  const group = new THREE.Group();
  const geo = new THREE.CylinderGeometry(sec.radius, sec.radius, sec.height, 6, 1, false);
  const edges = new THREE.EdgesGeometry(geo);
  const wireMat = new THREE.LineBasicMaterial({ color: PRIMARY, transparent: true, opacity: 0.6 });
  const wireframe = new THREE.LineSegments(edges, wireMat);
  wireframe.position.y = sec.y + sec.height / 2;
  group.add(wireframe);

  const fillMat = new THREE.MeshBasicMaterial({ color: PRIMARY, transparent: true, opacity: 0.02, side: THREE.DoubleSide, depthWrite: false });
  const fill = new THREE.Mesh(geo, fillMat);
  fill.position.y = sec.y + sec.height / 2;
  group.add(fill);

  const topGeo = new THREE.CircleGeometry(sec.radius, 6);
  const topMat = new THREE.MeshBasicMaterial({ color: PRIMARY, transparent: true, opacity: 0.035, side: THREE.DoubleSide, depthWrite: false });
  const top = new THREE.Mesh(topGeo, topMat);
  top.rotation.x = -Math.PI / 2;
  top.position.y = sec.y + sec.height;
  group.add(top);

  const ringGeo = new THREE.RingGeometry(sec.radius - 0.05, sec.radius + 0.05, 6);
  const ringMat = new THREE.MeshBasicMaterial({ color: PRIMARY, transparent: true, opacity: 0.1, side: THREE.DoubleSide, depthWrite: false });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = sec.y + sec.height;
  group.add(ring);

  for (let i = 0; i < 6; i++) {
    const angle = (i / 6) * Math.PI * 2;
    const points = [
      new THREE.Vector3(0, sec.y + 0.01, 0),
      new THREE.Vector3(Math.cos(angle) * sec.radius, sec.y + 0.01, Math.sin(angle) * sec.radius),
    ];
    group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), new THREE.LineBasicMaterial({ color: PRIMARY, transparent: true, opacity: 0.1 })));
  }

  scene.add(group);
  sectionMaterials[sec.id] = { wireMat, fillMat, topMat, ringMat };
});

// Vertical connectors
stages.forEach((sec, i) => {
  if (i === stages.length - 1) return;
  const next = stages[i + 1];
  for (let j = 0; j < 6; j++) {
    const angle = (j / 6) * Math.PI * 2;
    const r = next.radius * 0.5;
    const pts = [
      new THREE.Vector3(Math.cos(angle) * r, next.y + next.height, Math.sin(angle) * r),
      new THREE.Vector3(Math.cos(angle) * r * 1.2, sec.y, Math.sin(angle) * r * 1.2),
    ];
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: PRIMARY, transparent: true, opacity: 0.12 })));
  }
});

// Spine
const spineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -0.5, 0), new THREE.Vector3(0, 7.5, 0)]);
const spineMat = new THREE.LineBasicMaterial({ color: PRIMARY, transparent: true, opacity: 0.35 });
scene.add(new THREE.Line(spineGeo, spineMat));

// Core
const coreGeo = new THREE.IcosahedronGeometry(0.3, 1);
const coreMat = new THREE.MeshBasicMaterial({ color: PRIMARY, transparent: true, opacity: 0.2, wireframe: true });
const core = new THREE.Mesh(coreGeo, coreMat);
core.position.y = 3.5;
scene.add(core);

const coreGlow = new THREE.PointLight(PRIMARY, 1.5, 15);
coreGlow.position.y = 3.5;
scene.add(coreGlow);

// Containment ring
const containGeo = new THREE.TorusGeometry(5, 0.02, 8, 64);
const containMat = new THREE.MeshBasicMaterial({ color: PRIMARY, transparent: true, opacity: 0.08 });
const containRing = new THREE.Mesh(containGeo, containMat);
containRing.rotation.x = Math.PI / 2;
containRing.position.y = -0.2;
scene.add(containRing);

// Section lights
const sectionLights = {};
stages.forEach(sec => {
  const light = new THREE.PointLight(PRIMARY, 0.3, 4);
  light.position.set(sec.radius * 0.5, sec.y + sec.height / 2, 0);
  scene.add(light);
  sectionLights[sec.id] = light;
});

// Data particles (reduced for performance)
const dataParticles = [];
for (let i = 0; i < 15; i++) {
  const geo = new THREE.SphereGeometry(0.05, 4, 4);
  const mat = new THREE.MeshBasicMaterial({ color: PRIMARY, transparent: true, opacity: 0.5 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData = { offset: Math.random(), speed: 0.15 + Math.random() * 0.2 };
  scene.add(mesh);
  dataParticles.push({ mesh, mat });
}

// Dust (static cloud, rotated for movement effect)
const dustGeo = new THREE.BufferGeometry();
const dustCount = 150;
const dustPos = new Float32Array(dustCount * 3);
for (let i = 0; i < dustCount; i++) {
  dustPos[i*3] = (Math.random()-0.5)*20;
  dustPos[i*3+1] = Math.random()*10;
  dustPos[i*3+2] = (Math.random()-0.5)*20;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({ color: PRIMARY, size: 0.025, transparent: true, opacity: 0.2 });
const dustMesh = new THREE.Points(dustGeo, dustMat);
scene.add(dustMesh);

// ===== HUD CARDS =====
const alertContainer = document.getElementById('alertContainer');
const leaderSVG = document.getElementById('leaderLines');
const alerts = {};
const alertPositions = {};

const alertLayout = {
  visitors: { side: 'left', row: 0 },
  browse:   { side: 'right', row: 0 },
  cart:     { side: 'left', row: 1 },
  checkout: { side: 'right', row: 1 },
  payment:  { side: 'left', row: 2 },
  delivery: { side: 'right', row: 2 },
};

stages.forEach(sec => {
  const el = document.createElement('div');
  el.className = 'hud-card';
  el.id = 'hud-' + sec.id;
  el.innerHTML = `
    <div class="hud-name"><div class="hud-dot"></div>${sec.label}</div>
    <div class="hud-val" id="hv-${sec.id}">${sec.metric}</div>
    <div class="hud-sub" id="hs-${sec.id}">${sec.sub}</div>
    <div class="resize-handle" data-resize="${sec.id}"></div>
  `;
  el.style.pointerEvents = 'auto';
  alertContainer.appendChild(el);
  alerts[sec.id] = el;

  const layout = alertLayout[sec.id];
  const w = window.innerWidth;
  const h = window.innerHeight;
  const startY = h * 0.16;
  const spacing = Math.min(105, (h * 0.58) / 3);
  let x, y;
  if (layout.side === 'right') { x = w * 0.63; } else { x = w * 0.12; }
  y = startY + layout.row * spacing;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  alertPositions[sec.id] = { x, y };
});

// Drag logic
let activeDrag = null;
let dragOffset = { x: 0, y: 0 };
alertContainer.style.pointerEvents = 'none';

document.addEventListener('mousedown', (e) => {
  if (e.target.closest('.resize-handle')) return;
  const card = e.target.closest('.hud-card');
  if (!card) return;
  activeDrag = card.id.replace('hud-', '');
  const rect = card.getBoundingClientRect();
  dragOffset.x = e.clientX - rect.left;
  dragOffset.y = e.clientY - rect.top;
  card.style.cursor = 'grabbing';
  card.style.zIndex = '16';
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (!activeDrag) return;
  const pos = alertPositions[activeDrag];
  pos.x = e.clientX - dragOffset.x;
  pos.y = e.clientY - dragOffset.y;
  alerts[activeDrag].style.left = pos.x + 'px';
  alerts[activeDrag].style.top = pos.y + 'px';
});

// Resize logic
let activeResize = null;
let resizeStart = { x: 0, y: 0, w: 0, h: 0 };

document.addEventListener('mousedown', (e) => {
  const handle = e.target.closest('.resize-handle');
  if (handle) {
    activeResize = handle.dataset.resize;
    const card = alerts[activeResize];
    const rect = card.getBoundingClientRect();
    resizeStart = { x: e.clientX, y: e.clientY, w: rect.width, h: rect.height };
    e.preventDefault();
    e.stopPropagation();
  }
});

document.addEventListener('mousemove', (e) => {
  if (activeResize) {
    const dx = e.clientX - resizeStart.x;
    const dy = e.clientY - resizeStart.y;
    const card = alerts[activeResize];
    card.style.width = Math.max(150, resizeStart.w + dx) + 'px';
    card.style.height = Math.max(60, resizeStart.h + dy) + 'px';
  }
});

document.addEventListener('mouseup', () => {
  if (activeDrag) {
    alerts[activeDrag].style.cursor = 'grab';
    alerts[activeDrag].style.zIndex = '15';
    activeDrag = null;
  }
  activeResize = null;
});

// Leader lines
function updateLeaderLines() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  stages.forEach(sec => {
    const el = alerts[sec.id];
    const rect = el.getBoundingClientRect();
    const worldPos = new THREE.Vector3(0, sec.y + sec.height / 2, 0);
    const screenPos = worldPos.clone().project(camera);
    const sx = (screenPos.x * 0.5 + 0.5) * w;
    const sy = (-screenPos.y * 0.5 + 0.5) * h;

    let line = document.getElementById('line-' + sec.id);
    let dot = document.getElementById('ldot-' + sec.id);
    if (!line) {
      line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      line.id = 'line-' + sec.id;
      line.setAttribute('fill', 'none');
      line.setAttribute('stroke-width', '1');
      line.setAttribute('stroke-dasharray', '5 4');
      leaderSVG.appendChild(line);
      dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.id = 'ldot-' + sec.id;
      dot.setAttribute('r', '3');
      leaderSVG.appendChild(dot);
    }

    const isLeft = (rect.left + rect.width / 2) < w / 2;
    const edgeX = isLeft ? rect.right : rect.left;
    const edgeY = rect.top + rect.height / 2;
    const isDegraded = el.classList.contains('degraded');
    const isRecovered = el.classList.contains('recovered');
    const stroke = isDegraded ? 'rgba(255,51,68,0.35)' : isRecovered ? 'rgba(0,229,255,0.25)' : 'rgba(28,231,131,0.2)';
    const dotFill = isDegraded ? '#ff3344' : isRecovered ? '#00e5ff' : PRIMARY_CSS;

    line.setAttribute('stroke', stroke);
    line.setAttribute('points', `${sx},${sy} ${edgeX},${edgeY}`);
    dot.setAttribute('fill', dotFill);
    dot.setAttribute('cx', sx);
    dot.setAttribute('cy', sy);
  });
}

// Alert state
function setAlertState(id, mode) {
  const el = alerts[id];
  const val = document.getElementById('hv-' + id);
  const sub = document.getElementById('hs-' + id);
  if (mode === 'degraded') {
    el.className = 'hud-card degraded';
    val.textContent = degradedMetrics[id].metric;
    sub.textContent = degradedMetrics[id].sub;
  } else if (mode === 'recovered') {
    el.className = 'hud-card recovered';
    val.textContent = recoveredMetrics[id].metric;
    sub.textContent = recoveredMetrics[id].sub;
  } else {
    el.className = 'hud-card';
    const s = stages.find(s => s.id === id);
    val.textContent = s.metric;
    sub.textContent = s.sub;
  }
}

// Section colour
function setSectionColor(id, color, intensity) {
  const m = sectionMaterials[id];
  m.wireMat.color.setHex(color);
  m.wireMat.opacity = intensity;
  m.fillMat.color.setHex(color);
  m.fillMat.opacity = color === RED ? 0.05 : 0.02;
  m.topMat.color.setHex(color);
  m.topMat.opacity = color === RED ? 0.07 : 0.035;
  m.ringMat.color.setHex(color);
  m.ringMat.opacity = color === RED ? 0.22 : 0.1;
  sectionLights[id].color.setHex(color);
  sectionLights[id].intensity = color === RED ? 2.5 : 0.3;
}

// ===== ANIMATION =====
let time = 0;
let particleSpeed = 1.0;
let frameCount = 0;

function animate(now) {
  requestAnimationFrame(animate);
  if (now - lastFrameTime < FRAME_INTERVAL) return;
  lastFrameTime = now;
  time += 0.033;
  frameCount++;
  controls.update();

  core.rotation.x = time * 0.4;
  core.rotation.y = time * 0.6;
  containRing.rotation.z = time * 0.08;
  dustMesh.rotation.y = time * 0.02;

  dataParticles.forEach(p => {
    const d = p.mesh.userData;
    d.offset += 0.002 * d.speed * particleSpeed;
    if (d.offset > 1) d.offset = 0;
    const t = d.offset;
    const r = 4.0 - 2.8 * t;
    const y = 7.0 - t * 7.5;
    const angle = t * Math.PI * 4 + d.speed * 20;
    p.mesh.position.set(Math.cos(angle) * r * 0.6, y, Math.sin(angle) * r * 0.6);
  });

  if (state.phase === 'degraded') {
    const pulse = Math.sin(time * 4) * 0.3 + 0.7;
    coreGlow.intensity = pulse * 3;
    coreGlow.color.setHex(RED);
    coreMat.color.setHex(RED);
    spineMat.color.setHex(RED);
    spineMat.opacity = pulse * 0.5;
    containMat.color.setHex(RED);
    containMat.opacity = pulse * 0.12;
    stages.forEach(sec => {
      const m = sectionMaterials[sec.id];
      if (m.wireMat.color.getHex() === RED) {
        m.wireMat.opacity = 0.5 + pulse * 0.5;
        m.fillMat.opacity = 0.03 + pulse * 0.04;
        m.ringMat.opacity = 0.12 + pulse * 0.15;
        sectionLights[sec.id].intensity = pulse * 3;
      }
    });
  } else if (state.phase === 'recovering') {
    coreGlow.color.setHex(CYAN); coreGlow.intensity = 2;
    coreMat.color.setHex(CYAN); spineMat.color.setHex(CYAN); spineMat.opacity = 0.4;
    containMat.color.setHex(CYAN); containMat.opacity = 0.1;
  } else {
    coreGlow.color.setHex(PRIMARY); coreGlow.intensity = 1.5;
    coreMat.color.setHex(PRIMARY); spineMat.color.setHex(PRIMARY); spineMat.opacity = 0.35;
    containMat.color.setHex(PRIMARY); containMat.opacity = 0.08;
  }

  if (frameCount % 4 === 0) updateLeaderLines();
  renderer.render(scene, camera);
}

animate();

// ===== REVENUE =====
function fmt(n) {
  if (n >= 1_000_000) return '$' + (n/1_000_000).toFixed(2) + 'M';
  if (n >= 1_000) return '$' + Math.round(n/1_000).toLocaleString() + 'K';
  return '$' + Math.round(n).toLocaleString();
}

setInterval(() => {
  if (state.phase === 'healthy' || state.phase === 'recovered') state.revenue += state.rate / 60;
  else if (state.phase === 'degraded') {
    state.revenue -= state.riskPerMin / 60 * (0.8 + Math.random() * 0.4);
    state.totalLost += state.riskPerMin / 60;
    if (state.revenue < 500_000) state.revenue = 500_000;
  } else if (state.phase === 'recovering') state.revenue += 6000 / 60;

  document.getElementById('revAmt').textContent = fmt(state.revenue);
  if (state.phase === 'degraded') {
    document.getElementById('revAmt').className = 'amount red';
    document.getElementById('revRate').className = 'rate neg';
    document.getElementById('revRate').textContent = '-$' + Math.round(state.riskPerMin).toLocaleString() + '/min';
  } else {
    document.getElementById('revAmt').className = 'amount';
    document.getElementById('revRate').className = 'rate pos';
    document.getElementById('revRate').textContent = '+$' + Math.round(state.rate).toLocaleString() + '/min';
  }
}, 1000);

// ===== TICKER =====
function addTicker(msg, type = '') {
  const bar = document.getElementById('ticker');
  const el = document.createElement('div');
  el.className = 'ticker-item ' + type;
  el.textContent = msg;
  bar.prepend(el);
  if (bar.children.length > 5) bar.removeChild(bar.lastChild);
}

// ===== FAILURE =====
document.getElementById('failBtn').addEventListener('click', () => {
  if (state.phase !== 'healthy') return;
  state.phase = 'degraded';
  particleSpeed = 0.15;
  document.getElementById('failBtn').disabled = true;
  document.getElementById('resetBtn').classList.remove('hidden');
  document.getElementById('riskBanner').classList.remove('hidden');
  document.getElementById('sDot').className = 'dot red';
  document.getElementById('sText').textContent = 'CRITICAL FAILURE';
  controls.autoRotate = false;
  addTicker('Traffic spike: 4x capacity — systems stressed', 'error');

  const order = ['delivery', 'payment', 'checkout', 'cart', 'browse', 'visitors'];
  order.forEach((id, i) => {
    setTimeout(() => {
      setSectionColor(id, RED, 0.8);
      setAlertState(id, 'degraded');
      if (i === 0) addTicker('Fulfilment backlog growing', 'error');
      if (i === 1) addTicker('Payment gateway: 34% failure rate', 'error');
      if (i === 3) addTicker('Cart abandonment: 76%', 'error');
      if (i === 5) addTicker('Revenue loss: $45,000/min', 'error');
    }, 500 + i * 700);
  });
  setTimeout(() => document.getElementById('fixBtn').classList.remove('hidden'), 5500);
});

// ===== FIX =====
document.getElementById('fixBtn').addEventListener('click', () => {
  if (state.phase !== 'degraded') return;
  state.phase = 'recovering';
  document.getElementById('fixBtn').disabled = true;
  document.getElementById('riskBanner').classList.add('hidden');
  document.getElementById('sDot').className = 'dot cyan';
  document.getElementById('sText').textContent = 'RECOVERING';
  addTicker('Auto-remediation deployed — scaling infrastructure', 'success');

  const order = ['visitors', 'browse', 'cart', 'checkout', 'payment', 'delivery'];
  order.forEach((id, i) => {
    setTimeout(() => {
      setSectionColor(id, CYAN, 0.6);
      setAlertState(id, 'recovered');
      if (i === 0) addTicker('CDN cache primed — load balanced', 'success');
      if (i === 2) addTicker('Cart service scaled: 4 → 16 pods', 'success');
      if (i === 4) addTicker('Payment retry circuit restored', 'success');
    }, 400 + i * 500);
  });

  setTimeout(() => {
    state.phase = 'recovered';
    state.rate = 14200;
    particleSpeed = 1.8;
    controls.autoRotate = true;
    stages.forEach(sec => {
      setSectionColor(sec.id, PRIMARY, 0.6);
      setAlertState(sec.id, 'healthy');
      sectionLights[sec.id].color.setHex(PRIMARY);
      sectionLights[sec.id].intensity = 0.4;
    });
    dataParticles.forEach(p => p.mat.color.setHex(PRIMARY));
    dustMat.color.setHex(PRIMARY);
    document.getElementById('sDot').className = 'dot';
    document.getElementById('sText').textContent = 'SYSTEMS NOMINAL';
    document.getElementById('savedBanner').classList.remove('hidden');
    document.getElementById('savedVal').textContent = fmt(state.totalLost);
    addTicker('All systems restored — ' + fmt(state.totalLost) + ' protected', 'success');
  }, 5000);
});

// ===== RESET =====
document.getElementById('resetBtn').addEventListener('click', () => {
  state.phase = 'healthy';
  state.revenue = 2_847_000;
  state.rate = 12400;
  state.totalLost = 0;
  particleSpeed = 1.0;
  stages.forEach(sec => {
    setSectionColor(sec.id, PRIMARY, 0.6);
    setAlertState(sec.id, 'healthy');
    sectionLights[sec.id].color.setHex(PRIMARY);
    sectionLights[sec.id].intensity = 0.3;
  });
  dataParticles.forEach(p => p.mat.color.setHex(PRIMARY));
  dustMat.color.setHex(PRIMARY);
  controls.autoRotate = true;
  document.getElementById('failBtn').disabled = false;
  document.getElementById('fixBtn').classList.add('hidden');
  document.getElementById('fixBtn').disabled = false;
  document.getElementById('resetBtn').classList.add('hidden');
  document.getElementById('riskBanner').classList.add('hidden');
  document.getElementById('savedBanner').classList.add('hidden');
  document.getElementById('sDot').className = 'dot';
  document.getElementById('sText').textContent = 'SYSTEMS NOMINAL';
  document.getElementById('ticker').innerHTML = '';
  addTicker('System reset — nominal');
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

addTicker('Command Centre online — monitoring conversion funnel');
</script>
